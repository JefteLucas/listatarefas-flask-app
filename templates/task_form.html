<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Nova Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4" style="max-width: 600px;">

        <h1 class="mb-4">
            {% if task %}
                Editar Tarefa
            {% else %}
                Nova Tarefa
            {% endif %}
        </h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <!-- Formulário -->
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Campo Título -->
            <div class="mb-3">
                <label for="title" class="form-label fw-semibold">Título *</label>
                <input type="text" class="form-control" id="title" name="title"
                    value="{{ task.title if task else '' }}" required>
            </div>

            <!-- Campo Descrição -->
            <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Descrição</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ task.description if task else '' }}</textarea>
            </div>
            
            <!-- Campo Prioridade -->
            <div class="mb-3">
                <label for="priority" class="form-label fw-semibold">Prioridade</label>
                <select class="form-select" name="priority" id="priority">
                    <option value="Baixa" {% if task and task.priority == 'Baixa' %}selected{% endif %}>Baixa</option>
                    <option value="Média" {% if task and task.priority == "Média" %}selected{% endif %}>Média</option>
                    <option value="Alta" {% if task and task.priority == 'Alta' %}selected{% endif %}>Alta</option>
                </select>
            </div>

            <!-- Checkbox -->
            {% if task %}
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="completed" name="completed"
                        {% if task.completed %}checked{% endif %}>
                    <label class="form-check-label" for="completed">Marcar como concluída</label>
                </div>
            {% endif %}

            <!-- Botões salvar e cancelar -->
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"> Salvar</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
