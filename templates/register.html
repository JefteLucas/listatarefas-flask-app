<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-card {
            max-width: 450px;
            width: 100%;
            border-radius: 20px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100" style="background: #f0f2f5;">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <h2 class="text-center fw-bold mb-4">Criar conta</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('register') }}">
            <div class="mb-3">
               <label for="name" class="form-label fw-semibold">Nome completo</label>
               <input type="text" class="form-control" id="name" name="name" placeholder="Seu nome"> 
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email *</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Senha *</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label fw-semibold">Confirmar senha *</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Digite novamente" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Cadastrar</button>
        </form>
        <hr>
        <p class="text-center mb-0">Já tem conta ? <a href="{{ url_for('login') }}"> Faça login</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
